# Runs the test suite; a warning fails it. Called by ci.yml.
name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: test
      - run: mix test --warnings-as-errors
