# Headless: gives each pod a stable DNS name (swarm-0.swarm.netrts.svc.cluster.local, ...), which
# is its Erlang node name. Not-ready pods are listed too, so the nodes find each other while they
# start.
apiVersion: v1
kind: Service
metadata:
  name: swarm
  namespace: netrts
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: swarm
  ports:
    - name: epmd
      port: 4369
