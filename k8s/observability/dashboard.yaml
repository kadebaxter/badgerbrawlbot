# The Grafana dashboard. kube-prometheus-stack's Grafana loads ConfigMaps with this label.
# (Or import the JSON under data: by hand: Dashboards > New > Import.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: netrts-swarm-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  netrts-swarm.json: |
    {
      "title": "NetRTS Swarm",
      "uid": "netrts-swarm",
      "tags": [
        "netrts"
      ],
      "timezone": "browser",
      "refresh": "5s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus"
          },
          {
            "name": "loki",
            "label": "Loki",
            "type": "datasource",
            "query": "loki"
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "Waves and leaders",
            "datasource": {
              "type": "loki",
              "uid": "${loki}"
            },
            "enable": true,
            "iconColor": "orange",
            "expr": "{namespace=\"netrts\"} |~ \"decision kind=(wave_launched|wave_recalled|all_in|leader)\" | logfmt",
            "titleFormat": "{{kind}}",
            "textFormat": "{{msg}}"
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Swarm",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Leader",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The pod whose ra server leads; it runs the game loop.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "swarm_is_leader == 1",
              "legendFormat": "{{pod}}",
              "instant": true
            }
          ],
          "options": {
            "textMode": "name",
            "colorMode": "none",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Nodes up",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(up{namespace=\"netrts\"} == 1)",
              "legendFormat": "",
              "instant": true
            }
          ],
          "options": {
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Unit processes",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(swarm_unit_processes)",
              "legendFormat": "",
              "instant": true
            }
          ],
          "options": {
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Game tick",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_game_tick)",
              "legendFormat": "",
              "instant": true
            }
          ],
          "options": {
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Ore",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_ore)",
              "legendFormat": "",
              "instant": true
            }
          ],
          "options": {
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Enemy fighters known",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_enemy_fighters_known)",
              "legendFormat": "",
              "instant": true
            }
          ],
          "options": {
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Leader per pod",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "A step from one pod to another is a failover.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "swarm_is_leader",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Unit processes per node",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Where the units run. After a node dies its units reappear on the others.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "swarm_unit_processes",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Unit replies in time",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Units that answered before the tick's deadline. A gap means slow nodes or messages.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_units_asked)",
              "legendFormat": "asked"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_unit_replies)",
              "legendFormat": "answered"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Tick time",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "From reading the state to posting orders, on the leader.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_tick_seconds)",
              "legendFormat": "tick"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Commands per second",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Accepted, rejected by the game, or not sent (HTTP errors).",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (result) (rate(swarm_commands_total[1m]))",
              "legendFormat": "{{result}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Ticks played per second",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(swarm_ticks_total[1m]))",
              "legendFormat": "ticks/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "row",
          "title": "Game",
          "id": 14,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Score",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Destruction + economy + survival. League points come from the margin.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_score{who=\"us\"})",
              "legendFormat": "us"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_score{who=\"best_enemy\"})",
              "legendFormat": "best opponent"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Ore",
          "id": 16,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_ore)",
              "legendFormat": "ore"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Our units",
          "id": 17,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 30
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (type) (swarm_units)",
              "legendFormat": "{{type}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Fighter roles",
          "id": 18,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "wave: out attacking; guard/escort: holding; attacker: waiting for the next wave.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 30
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (role) (swarm_roles)",
              "legendFormat": "{{role}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Wave vs enemy",
          "id": 19,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 30
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_wave_size)",
              "legendFormat": "wave out"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_enemy_fighters_known)",
              "legendFormat": "enemy fighters known"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Enemy strength known",
          "id": 20,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "HP x damage per tick of the enemy army and towers we remember. Waves launch at 1.5x this.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 38
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(swarm_enemy_strength)",
              "legendFormat": "strength"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "state-timeline",
          "title": "Mode",
          "id": 21,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 38
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (mode) (swarm_mode)",
              "legendFormat": "{{mode}}"
            }
          ],
          "options": {
            "showValue": "never",
            "mergeValues": true
          }
        },
        {
          "type": "row",
          "title": "Decisions",
          "id": 22,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 46
          },
          "panels": []
        },
        {
          "type": "logs",
          "title": "Decision log",
          "id": 23,
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 12,
            "w": 16,
            "x": 0,
            "y": 47
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "{namespace=\"netrts\"} |= \"decision kind=\" | logfmt | line_format \"{{.pod}}  tick {{.tick}}  {{.kind}}: {{.msg}}\""
            }
          ],
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          }
        },
        {
          "type": "timeseries",
          "title": "Decisions by kind",
          "id": 24,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 12,
            "w": 8,
            "x": 16,
            "y": 47
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (kind) (increase(swarm_decisions_total[1m]))",
              "legendFormat": "{{kind}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
